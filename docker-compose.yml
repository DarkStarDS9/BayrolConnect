version: '3.8'

services:
  bayrol-connect:
    build: .
    restart: always
    environment:
      - CONFIG=${CONFIG}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.40.1
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:9.2.5
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage:
  prometheus-data:
